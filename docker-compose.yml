version: '3.8'

services:
  # BDD server
  mongodb:
    image: mongo:latest
    container_name: mon_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - etl-network

  # App ETL
  migration_mongodb:
    build: .
    container_name: python-etl-app
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    networks:
      - etl-network

# Network declaration
networks:
  etl-network:
    driver: bridge

volumes:
  mongo_data: